# Pull-request gate (no Azure access): every test, both type checks, both builds and a lint ratchet.
name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Existing lint errors on main; new code may not add to them.
      LINT_ERROR_BASELINE: 83
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Unit tests
        run: node --test tests/unit/*.test.mjs
      - name: System tests
        run: node --test tests/system/*.test.mjs
      - name: Type checks
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.azure.json
      - name: Lint (no new errors)
        run: |
          npx eslint . --ignore-pattern dist --ignore-pattern .next -f json -o eslint.json || true
          node -e "const r=require('./eslint.json');const e=r.reduce((n,f)=>n+f.errorCount,0),w=r.reduce((n,f)=>n+f.warningCount,0);console.log('lint errors',e,'warnings',w,'baseline',process.env.LINT_ERROR_BASELINE);if(e>Number(process.env.LINT_ERROR_BASELINE))process.exit(1)"
      - name: Cloudflare build
        run: npm run build
      - name: Azure build
        run: MNEMBA_TARGET=azure npx next build --webpack
      - name: No provider credential names in client bundles
        run: |
          if grep -rlE "FIVE_DOLLAR_FOOTBALL_API_KEY|API_FOOTBALL_KEY|FOOTBALL_DATA_KEY" dist/client .next/static 2>/dev/null; then echo "server credential configuration found in client output"; exit 1; fi
